name: Pruebas del relay

on:
  push:
    paths: ["relay/**", "pwa/**", ".github/workflows/relay-tests.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest relay/test_wol_relay.py -v
